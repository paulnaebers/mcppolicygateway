name: Technical demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check configuration and policy
        run: python -m unittest discover -s tests -v
      - name: Run both conditions with record set 1
        run: python run_demo.py
      - name: Run both conditions with record set 2
        run: python run_demo.py --record-set 2
      - name: Save results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-${{ matrix.os }}-python-${{ matrix.python }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14
